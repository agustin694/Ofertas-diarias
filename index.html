  <style>

    * {

    /* =========================
       CARRUSEL
    ========================= */

    .hero-slider {

      position: relative;

      width: 100%;

      height: 330px;

      border-radius: 24px;

      overflow: hidden;

      margin-bottom: 22px;

      background:
        linear-gradient(
          135deg,
          #ff4b3e,
          #ff766b
        );

      box-shadow:

    }


    .hero-slide {

      position: absolute;

      inset: 0;

      opacity: 0;

      transition:

    }

    }


    .slider-dots {

      position: absolute;

      bottom: 13px;

      right: 18px;

      display: flex;

      gap: 6px;

      z-index: 5;
    }


    .slider-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.5);
    }


    .slider-dot.active {

      background: white;

      transform: scale(1.25);

    /* =========================
       BUSCADOR

    .search-box {

<script>


  /* =========================
     CONFIGURACIÓN
  ========================= */


  const SUPABASE_URL =
    "https://hovuypchngweflamnubr.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_DomJB-3gsWOZ2HBkYlSfAQ_59cvT9uM";


  const USER_ID =
    "9d7fb4a8-28e6-4184-8a8b-ea40825b2573";


  const WHATSAPP =
    "5491176310928";


  let products = [];


  let selectedCategory =
    "Todos";


  let favorites =
    JSON.parse(
      localStorage.getItem(
        "favorites"
      ) || "[]"
    );


  let cart =
    JSON.parse(
      localStorage.getItem(
        "cart"
      ) || "[]"
    );


  const productsContainer =
    document.getElementById(
      "products"
    );


  const searchInput =
    document.getElementById(
      "search"
    );


  /* =========================
     CARRUSEL
  ========================= */


  let sliderProducts = [];

  let sliderIndex = 0;

  let sliderTimer = null;


  function getRandomProducts() {

    if (!products.length) {

      return [];

    }


    const shuffled =
      [...products].sort(
        () => Math.random() - 0.5
      );


    return shuffled.slice(
      0,
      Math.min(6, shuffled.length)
    );

  }


  function startSlider() {

    if (!products.length) {

      return;

    }


    sliderProducts =
      getRandomProducts();


    sliderIndex = 0;


    renderHeroSlide();


    if (sliderTimer) {

      clearInterval(
        sliderTimer
      );

    }


    sliderTimer =
      setInterval(

        () => {

          sliderIndex++;


          if (
            sliderIndex >=
            sliderProducts.length
          ) {

            sliderProducts =
              getRandomProducts();

            sliderIndex = 0;

          }


          renderHeroSlide();

        },

        4000

      );

  }


  function renderHeroSlide() {

    const slider =
      document.getElementById(
        "heroSlider"
      );


    const dots =
      document.getElementById(
        "sliderDots"
      );


    if (
      !slider ||
      !sliderProducts.length
    ) {

      return;

    }


    const product =
      sliderProducts[
        sliderIndex
      ];


    const images =
  Array.isArray(product.images)
    ? product.images
    : [];

const image =
  images.length > 0
    ? images[0]
    : (
        product.image_url ||
        product.image ||
        "https://via.placeholder.com/500x400?text=Sin+foto"
      );


    const price =

      Number(product.price)

        .toLocaleString(

          "es-AR",

          {

            style:
              "currency",

            currency:
              "ARS"

          }

        );


    const oldSlides =
      slider.querySelectorAll(
        ".hero-slide"
      );


    oldSlides.forEach(
      slide =>
        slide.remove()
    );


    const slide =
      document.createElement(
        "div"
      );


    slide.className =
      "hero-slide active";


    slide.innerHTML = `

      <img
        src="${image}"
        alt="${product.name}"
      >

      <div class="hero-overlay">

        <div class="hero-content">

          <span class="tag">
            ⭐ PRODUCTO DESTACADO
          </span>

          <h2>
            ${product.name}
          </h2>

          <div class="hero-price">
            ${price}
          </div>

          <button
            onclick="goToProduct('${product.id}')"
          >
            Ver producto →
          </button>

        </div>

      </div>

    `;


    slider.insertBefore(
      slide,
      dots
    );


    dots.innerHTML =
      sliderProducts
        .map(
          (_, index) =>

            `

            <span
              class="slider-dot ${
                index === sliderIndex
                  ? "active"
                  : ""
              }"
            ></span>

            `

        )
        .join("");

  }


  function goToProduct(productId) {

    const element =
      document.querySelector(
        `[data-product-id="${productId}"]`
      );


    if (element) {

      element.scrollIntoView({

        behavior: "smooth",

        block: "center"

      });

      return;

    }


    selectedCategory =
      "Todos";


    searchInput.value =
      "";


    renderProducts();


    setTimeout(

      () => {

        const productElement =
          document.querySelector(
            `[data-product-id="${productId}"]`
          );


        if (productElement) {

          productElement.scrollIntoView({

            behavior: "smooth",

            block: "center"

          });

        }

      },

      100

    );

  }


  /* =========================
     CARGAR PRODUCTOS
  ========================= */


  async function loadProducts() {

    productsContainer.innerHTML =

      `

      <div class="empty loading">

        🔄 Cargando productos...

      </div>

      `;


    try {

      const controller =
        new AbortController();


      const timeoutId =
        setTimeout(

          () => {

            controller.abort();

          },

          10000

        );


      const response =

        await fetch(

          `${SUPABASE_URL}/rest/v1/rpc/get_public_products`,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`

            },

            body:

              JSON.stringify({

                p_user_id:
                  USER_ID

              }),

            signal:
              controller.signal

          }

        );


      clearTimeout(
        timeoutId
      );


      if (!response.ok) {

        const errorText =
          await response.text();


        throw new Error(

          `Supabase respondió ${response.status}: ${errorText}`

        );

      }


      products =
        await response.json();


      console.log(
        "PRODUCTOS RECIBIDOS:",
        products
      );


      renderProducts();


      startSlider();


    }

    catch (error) {

      console.error(error);


      productsContainer.innerHTML =

        `

        <div class="empty">

          <h3>
            ⚠️ No se pudieron cargar los productos
          </h3>

          <p>
            ${error.message}
          </p>

        </div>

        `;

    }

  }


  /* =========================
     RENDER PRODUCTOS
  ========================= */


  function renderProducts() {

    const search =
      searchInput.value
        .toLowerCase()
        .trim();


    const filtered =

      products.filter(

        product => {

          const name =

            (product.name || "")
              .toLowerCase();


          const category =
            product.category || "";


          return (

            name.includes(search)

            &&

            (

              selectedCategory ===
                "Todos"

              ||

              (

                selectedCategory ===
                  "Liquidación"

                  ?

                  product.is_liquidation ===
                    true

                  :

                selectedCategory ===
                  "__FAVORITES__"

                  ?

                  favorites.includes(
                    product.id
                  )

                  :

                category ===
                  selectedCategory

              )

            )

          );

        }

      );


    if (
      filtered.length === 0
    ) {

      productsContainer.innerHTML =

        `

        <div class="empty">

          <div
            style="font-size:45px;"
          >
            🛍️
          </div>

          <h3>
            No encontramos productos
          </h3>

          <p>
            Probá con otra búsqueda o categoría.
          </p>

        </div>

        `;

      return;

    }


    productsContainer.innerHTML =

      filtered

        .map(

          product => {

            const image =

              product.image_url

              ||

              product.image

              ||

              "https://via.placeholder.com/500x400?text=Sin+foto";


            const price =

              Number(product.price)

                .toLocaleString(

                  "es-AR",

                  {

                    style:
                      "currency",

                    currency:
                      "ARS"

                  }

                );


            const stock =
              Number(
                product.stock ?? 0
              );


            let stockHTML =
              "";


            if (
              stock <= 0
            ) {

              stockHTML =

                `

                <div
                  class="stock agotado"
                >
                  🔴 Agotado
                </div>

                `;

            }

            else if (
              stock <= 3
            ) {

              stockHTML =

                `

                <div
                  class="stock pocas"
                >
                  🟠 Últimas ${stock} unidades
                </div>

                `;

            }

            else {

              stockHTML =

                `

                <div
                  class="stock disponible"
                >
                  🟢 Disponible
                </div>

                `;

            }


            const message =

              `Hola! Quiero consultar por ${product.name}`;


            const whatsapp =

              `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;


            return `

              <div
                class="product"
                data-product-id="${product.id}"
              >

                <div
                  class="product-image"
                >

                  <button

                    class="favorite-btn"

                    onclick="toggleFavorite('${product.id}')"

                    aria-label="Agregar a favoritos"

                  >

                    ${
                      favorites.includes(
                        product.id
                      )

                        ? "❤️"

                        : "🤍"
                    }

                  </button>


                  <button

                    class="select-btn"

                    onclick="toggleCart('${product.id}')"

                  >

                    ${
                      cart.includes(
                        product.id
                      )

                        ? "✅ Agregado a mi selección"

                        : "🛒 Agregar a mi selección"
                    }

                  </button>


                  ${
                    stock <= 0

                      ?

                      `

                      <span
                        class="badge agotado"
                      >
                        AGOTADO
                      </span>

                      `

                      :

                      ""
                  }


                  <div class="product-gallery">

  ${
    images.map(
      (img, index) => `
        <img
          src="${img}"
          alt="${product.name} - foto ${index + 1}"
          loading="lazy"
        >
      `
    ).join("")
  }

</div>

                </div>


                <div
                  class="product-info"
                >

                  <div
                    class="category"
                  >

                    ${
                      product.category ||
                      "Otros"
                    }

                  </div>


                  <h2>

                    ${product.name}

                  </h2>


                  <div
                    class="price"
                  >

                    ${price}

                  </div>


                  ${stockHTML}


                  ${
                    product.description

                      ?

                      `

                      <div
                        class="description"
                      >

                        ${product.description}

                      </div>

                      `

                      :

                      ""
                  }


                  <a

                    class="whatsapp"

                    href="${whatsapp}"

                    target="_blank"

                    rel="noopener"

                  >

                    📲 Consultar por WhatsApp

                  </a>

                </div>

              </div>

            `;

          }

        )

        .join("");

  }


  /* =========================
     FILTROS
  ========================= */


  function filterCategory(
    category
  ) {

    selectedCategory =
      category;


    renderProducts();

  }


  searchInput.addEventListener(

    "input",

    renderProducts

  );


  /* =========================
     FAVORITOS
  ========================= */


  function toggleFavorite(
    productId
  ) {

    if (
      favorites.includes(
        productId
      )
    ) {

      favorites =
        favorites.filter(

          id =>
            id !== productId

        );

    }

    else {

      favorites.push(
        productId
      );

    }


    localStorage.setItem(

      "favorites",

      JSON.stringify(
        favorites
      )

    );


    renderProducts();

  }


  function showFavorites() {

    selectedCategory =
      "__FAVORITES__";


    renderProducts();

  }


  /* =========================
     MI SELECCIÓN
  ========================= */


  function toggleCart(
    productId
  ) {

    if (
      cart.includes(
        productId
      )
    ) {

      cart =
        cart.filter(

          id =>
            id !== productId

        );

    }

    else {

      cart.push(
        productId
      );

    }


    localStorage.setItem(

      "cart",

      JSON.stringify(
        cart
      )

    );


    renderProducts();

  }


  /* =========================
     MAPA
  ========================= */


  let map = null;

  let marker = null;

  let selectedLocation = null;


  function showCart() {

    const selectedProducts =

      products.filter(

        product =>
          cart.includes(
            product.id
          )

      );


    if (
      selectedProducts.length === 0
    ) {

      alert(
        "🛒 Tu selección está vacía."
      );

      return;

    }


    const productList =

      selectedProducts

        .map(

          product =>

            `• ${product.name} - ${Number(product.price).toLocaleString("es-AR")}`

        )

        .join("\n");


    productsContainer.innerHTML =

      `

      <div
        class="shipping-box"
      >

        <h2>
          🛒 Mi selección
        </h2>


        <div
          class="selected-list"
        >

          ${productList.replace(
            /\n/g,
            "<br>"
          )}

        </div>


        <h2>
          🚚 Datos de envío
        </h2>


        <label
          for="customerName"
        >
          Nombre
        </label>


        <input
          id="customerName"
          type="text"
          placeholder="Tu nombre"
        >


        <label
          for="customerPhone"
        >
          Teléfono
        </label>


        <input
          id="customerPhone"
          type="tel"
          placeholder="Tu teléfono"
        >


        <label
          for="shippingAddress"
        >
          Dirección de entrega
        </label>


        <input
          id="shippingAddress"
          type="text"
          placeholder="Ej: Av. San Martín 1234"
        >


        <button
          class="map-button"
          onclick="buscarDireccion()"
        >

          📍 Buscar dirección en el mapa

        </button>


        <div id="map"></div>


        <p
          class="shipping-note"
        >

          Escribí tu dirección y tocá
          "Buscar dirección en el mapa".
          Verificá que el marcador esté
          ubicado correctamente.

        </p>


        <button
          class="send-order"
          onclick="enviarPedido()"
        >

          📲 Enviar pedido por WhatsApp

        </button>


        <button
          class="back-button"
          onclick="volverProductos()"
        >

          ← Volver a los productos

        </button>


      </div>

      `;


    iniciarMapa();

  }


  function iniciarMapa() {

    setTimeout(

      () => {

        if (map) {

          map.remove();

          map = null;

          marker = null;

        }


        map =
          L.map(
            "map"
          ).setView(

            [
              -34.5150,
              -58.7590
            ],

            13

          );


        L.tileLayer(

          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

          {

            attribution:
              "&copy; OpenStreetMap contributors"

          }

        ).addTo(map);

      },

      100

    );

  }


  async function buscarDireccion() {

    const input =
      document.getElementById(
        "shippingAddress"
      );


    const address =
      input.value.trim();


    if (!address) {

      alert(
        "📍 Escribí una dirección primero."
      );

      return;

    }


    try {

      const response =

        await fetch(

          "https://nominatim.openstreetmap.org/search?" +

          new URLSearchParams({

            q:
              address +
              ", Buenos Aires, Argentina",

            format:
              "json",

            limit:
              "1"

          }),

          {

            headers: {

              "Accept":
                "application/json"

            }

          }

        );


      const results =
        await response.json();


      if (
        !results.length
      ) {

        alert(

          "❌ No encontramos esa dirección. Probá escribirla de otra manera."

        );

        return;

      }


      const lat =
        Number(
          results[0].lat
        );


      const lon =
        Number(
          results[0].lon
        );


      selectedLocation = {

        lat:
          lat,

        lon:
          lon

      };


      map.setView(

        [
          lat,
          lon
        ],

        16

      );


      if (marker) {

        marker.setLatLng(

          [
            lat,
            lon
          ]

        );

      }

      else {

        marker =
          L.marker(

            [
              lat,
              lon
            ]

          ).addTo(
            map
          );

      }


      marker
        .bindPopup(
          "📍 Dirección de entrega"
        )
        .openPopup();

    }

    catch (error) {

      console.error(
        error
      );


      alert(

        "⚠️ No se pudo buscar la dirección. Revisá tu conexión."

      );

    }

  }


  /* =========================
     ENVIAR PEDIDO
  ========================= */


  function enviarPedido() {

    const name =

      document
        .getElementById(
          "customerName"
        )
        .value
        .trim();


    const phone =

      document
        .getElementById(
          "customerPhone"
        )
        .value
        .trim();


    const address =

      document
        .getElementById(
          "shippingAddress"
        )
        .value
        .trim();


    if (!name) {

      alert(
        "Por favor ingresá tu nombre."
      );

      return;

    }


    if (!phone) {

      alert(
        "Por favor ingresá tu teléfono."
      );

      return;

    }


    if (!address) {

      alert(
        "Por favor ingresá la dirección de entrega."
      );

      return;

    }


    if (!selectedLocation) {

      alert(
        "📍 Primero buscá la dirección en el mapa."
      );

      return;

    }


    const selectedProducts =

      products.filter(

        product =>
          cart.includes(
            product.id
          )

      );


    if (
      selectedProducts.length === 0
    ) {

      alert(
        "🛒 Tu selección está vacía."
      );

      return;

    }


    const productList =

      selectedProducts

        .map(

          product =>

            `• ${product.name} - $${Number(product.price).toLocaleString("es-AR")}`

        )

        .join("\n");


    const message =

      "Hola! Quiero realizar este pedido:\n\n" +

      productList +

      "\n\n" +

      "👤 Nombre: " +

      name +

      "\n" +

      "📞 Teléfono: " +

      phone +

      "\n" +

      "📍 Dirección de entrega: " +

      address +

      "\n\n" +

      "🗺️ Ubicación:\n" +

      `https://www.google.com/maps?q=${selectedLocation.lat},${selectedLocation.lon}`;


    const whatsapp =

      `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;


    window.location.href =
      whatsapp;

  }


  /* =========================
     VOLVER
  ========================= */


  function volverProductos() {

    selectedCategory =
      "Todos";


    searchInput.value =
      "";


    renderProducts();

  }


  /* =========================
     INICIO
  ========================= */


  loadProducts();


</script>


</body>

</html>
