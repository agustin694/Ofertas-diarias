<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ofertas Diarias</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #ddd;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 25px;
    }

    .categories button {
      border: 0;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .categories button:hover {
      background: #eee;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product h2 {
      font-size: 19px;
      margin: 0 0 8px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .description {
      color: #666;
      font-size: 14px;
      min-height: 40px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #666;
      grid-column: 1 / -1;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ OFERTAS DIARIAS</h1>
  <p>Electrodomésticos • Ropa • Hogar • Tecnología y mucho más</p>
</header>

<div class="container">

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔎 Buscar productos..."
  >

  <div class="categories">
    <button onclick="filterCategory('Todos')">Todos</button>
    <button onclick="filterCategory('Electrodomésticos')">Electrodomésticos</button>
    <button onclick="filterCategory('Ropa')">Ropa</button>
    <button onclick="filterCategory('Tecnología')">Tecnología</button>
    <button onclick="filterCategory('Hogar')">Hogar</button>
  </div>

  <div id="products" class="products">
    <div class="empty">Cargando productos...</div>
  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://hovuypchngweflamnubr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DomJB-3gsWOZ2HBkYlSfAQ_59cvT9uM";

  const USER_ID =
    "0174480b-537e-48dd-ab9c-643e367043af";

  const WHATSAPP =
    "5491176310928";

  let products = [];

  let selectedCategory = "Todos";

  const productsContainer =
    document.getElementById("products");

  const searchInput =
    document.getElementById("search");


  async function loadProducts() {

    productsContainer.innerHTML =
      '<div class="empty">Cargando productos...</div>';

    try {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/get_public_products`,
        {
          method: "POST",

          headers: {
  "Content-Type": "application/json",
  "apikey": SUPABASE_KEY,
  "Authorization": `Bearer ${SUPABASE_KEY}`
},

          body: JSON.stringify({
            p_user_id: USER_ID
          })
        }
      );

      if (!response.ok) {
  const errorText = await response.text();

  throw new Error(
    `Supabase respondió ${response.status}: ${errorText}`
  );
}

      products = await response.json();

      renderProducts();

    } catch (error) {

      console.error(error);

      productsContainer.innerHTML =
  `<div class="empty">
    <h3>Error al cargar productos</h3>
    <p>${error.message}</p>
  </div>`;
  }


  function renderProducts() {

    const search =
      searchInput.value.toLowerCase();

    const filtered =
      products.filter(product => {

        const name =
          (product.name || "").toLowerCase();

        const category =
          product.category || "";

        return (
          name.includes(search) &&
          (
            selectedCategory === "Todos" ||
            category === selectedCategory
          )
        );
      });


    if (filtered.length === 0) {

      productsContainer.innerHTML =
        '<div class="empty">No hay productos disponibles.</div>';

      return;
    }


    productsContainer.innerHTML =
      filtered.map(product => {

        const image =
          product.image_url ||
          "https://via.placeholder.com/500x400?text=Sin+foto";

        const price =
          Number(product.price).toLocaleString(
            "es-AR",
            {
              style: "currency",
              currency: "ARS"
            }
          );

        const message =
          `Hola! Quiero consultar por ${product.name}`;

        const whatsapp =
          `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;

        return `
          <div class="product">

            <img
              src="${image}"
              alt="${product.name}"
            >

            <div class="product-info">

              <h2>${product.name}</h2>

              <div class="price">
                ${price}
              </div>

              <div class="description">
                ${product.description || ""}
              </div>

              <a
                class="whatsapp"
                href="${whatsapp}"
                target="_blank">

                📲 Consultar por WhatsApp

              </a>

            </div>

          </div>
        `;

      }).join("");
  }


  function filterCategory(category) {

    selectedCategory = category;

    renderProducts();
  }


  searchInput.addEventListener(
    "input",
    renderProducts
  );


  loadProducts();

</script>

</body>
</html>
