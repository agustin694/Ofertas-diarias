<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ofertas Diarias</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- MAPA -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #111, #333);
      color: white;
      padding: 25px 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

    header h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 7px;
      opacity: .9;
    }

    .hero {
      margin: 15px auto;
      max-width: 1100px;
      padding: 30px 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff512f, #dd2476);
      color: white;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 17px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 15px 40px;
    }

    .search-box {
      margin: 20px 0;
    }

    #search {
      width: 100%;
      padding: 16px 18px;
      border: 2px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    #search:focus {
      border-color: #ff512f;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .categories button {
      border: none;
      background: white;
      padding: 11px 17px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .categories button:hover {
      background: #ff512f;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,.10);
      transition: transform .2s, box-shadow .2s;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 9px 25px rgba(0,0,0,.16);
    }

    .product-image {
      position: relative;
      width: 100%;
      height: 250px;
      background: #eee;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      background: #555;
      color: white;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .favorite-btn,
    .select-btn {
      position: absolute;
      z-index: 3;
      border: none;
      cursor: pointer;
      border-radius: 20px;
      padding: 7px 10px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .favorite-btn {
      top: 10px;
      right: 10px;
      background: white;
      font-size: 18px;
    }

    .select-btn {
      bottom: 10px;
      left: 10px;
      background: white;
      font-size: 12px;
    }

    .product-info {
      padding: 18px;
    }

    .category {
      color: #777;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .product h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 27px;
      font-weight: 900;
      color: #111;
      margin-bottom: 10px;
    }

    .stock {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .disponible {
      background: #e5f8e8;
      color: #17852b;
    }

    .pocas {
      background: #fff2d8;
      color: #b76a00;
    }

    .agotado {
      background: #eee;
      color: #555;
    }

    .description {
      color: #666;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #20c76a;
      color: white;
      padding: 13px;
      border-radius: 12px;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      border-radius: 18px;
      text-align: center;
      grid-column: 1 / -1;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .loading {
      font-size: 18px;
    }

    /* PANEL DE ENVÍO */

    .shipping-box {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-top: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.10);
    }

    .shipping-box h2 {
      margin-bottom: 15px;
    }

    .shipping-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .shipping-box input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .shipping-box input:focus {
      outline: none;
      border-color: #ff512f;
    }

    #map {
      width: 100%;
      height: 300px;
      border-radius: 15px;
      margin-top: 10px;
      overflow: hidden;
    }

    .map-button {
      width: 100%;
      border: none;
      background: #333;
      color: white;
      padding: 13px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .map-button:hover {
      background: #111;
    }

    .send-order {
      width: 100%;
      border: none;
      background: #20c76a;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .send-order:hover {
      opacity: .9;
    }

    .shipping-note {
      color: #666;
      font-size: 13px;
      margin-top: 8px;
      line-height: 1.4;
    }

    .whatsapp-floating {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #20c76a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      text-decoration: none;
      box-shadow: 0 5px 18px rgba(0,0,0,.25);
      z-index: 20;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 26px;
      }

      .hero {
        border-radius: 15px;
        padding: 25px 15px;
      }

      .hero h2 {
        font-size: 25px;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 280px;
      }
    }

  </style>
</head>

<body>

<header>

  <h1>🔥 OFERTAS DIARIAS</h1>

  <p>
    Electrodomésticos nuevos y usados
  </p>

</header>


<div class="container">

  <section class="hero">

    <h2>🔥 Ofertas del día</h2>

    <p>
      Encontrá productos a excelentes precios
      y consultanos por WhatsApp.
    </p>

  </section>


  <div class="search-box">

    <input
      id="search"
      type="search"
      placeholder="🔎 Buscar producto..."
    >

  </div>


  <!-- CATEGORÍAS -->

  <div class="categories">

    <button onclick="filterCategory('Todos')">
      Todos
    </button>

    <button onclick="filterCategory('Cocina')">
      🍳 Cocina
    </button>

    <button onclick="filterCategory('Hogar')">
      🏠 Hogar
    </button>

    <button onclick="filterCategory('Electrodomésticos')">
      ⚡ Electrodomésticos
    </button>

    <button onclick="filterCategory('Tecnología')">
      📱 Tecnología
    </button>

    <button onclick="filterCategory('Deportes')">
      🏅 Deportes
    </button>

    <button onclick="filterCategory('Liquidación')">
      🔥 Liquidación
    </button>

  </div>


  <!-- FAVORITOS Y SELECCIÓN -->

  <div class="categories">

    <button onclick="showFavorites()">
      ❤️ Favoritos
    </button>

    <button onclick="showCart()">
      🛒 Mi selección
    </button>

  </div>


  <!-- PRODUCTOS -->

  <div
    id="products"
    class="products">
  </div>

</div>


<a
  class="whatsapp-floating"
  href="https://wa.me/5491176310928"
  target="_blank"
  rel="noopener">

  📲

</a>


<footer>

  <p>
    © 2026 Ofertas Diarias
  </p>

  <p>
    Consultas y pedidos por WhatsApp
  </p>

</footer>


<script>

  const SUPABASE_URL =
    "https://hovuypchngweflamnubr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DomJB-3gsWOZ2HBkYlSfAQ_59cvT9uM";

  const USER_ID =
    "9d7fb4a8-28e6-4184-8a8b-ea40825b2573";

  const WHATSAPP =
    "5491176310928";


  let products = [];

  let selectedCategory = "Todos";


  let favorites =
    JSON.parse(
      localStorage.getItem("favorites") || "[]"
    );


  let cart =
    JSON.parse(
      localStorage.getItem("cart") || "[]"
    );


  const productsContainer =
    document.getElementById("products");


  const searchInput =
    document.getElementById("search");


  async function loadProducts() {

    productsContainer.innerHTML =
      '<div class="empty loading">🔄 Cargando productos...</div>';


    try {

      const controller =
        new AbortController();


      const timeoutId =
        setTimeout(() => {

          controller.abort();

        }, 10000);


      const response =
        await fetch(

          `${SUPABASE_URL}/rest/v1/rpc/get_public_products`,

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`

            },

            body:
              JSON.stringify({

                p_user_id:
                  USER_ID

              }),

            signal:
              controller.signal

          }

        );


      clearTimeout(timeoutId);


      if (!response.ok) {

        const errorText =
          await response.text();


        throw new Error(

          `Supabase respondió ${response.status}: ${errorText}`

        );

      }


      products =
        await response.json();


      console.log(
        "PRODUCTOS RECIBIDOS:",
        products
      );


      renderProducts();


    } catch (error) {

      console.error(error);


      productsContainer.innerHTML =

        `

        <div class="empty">

          <h3>
            ⚠️ No se pudieron cargar los productos
          </h3>

          <p>
            ${error.message}
          </p>

        </div>

        `;

    }

  }


  function renderProducts() {

    const search =
      searchInput.value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(product => {

        const name =
          (product.name || "")
            .toLowerCase();


        const category =
          product.category || "";


        return (

          name.includes(search)

          &&

          (

            selectedCategory === "Todos"

            ||

            (

              selectedCategory === "Liquidación"

                ? product.is_liquidation === true

                :

              selectedCategory === "__FAVORITES__"

                ? favorites.includes(product.id)

                :

              category === selectedCategory

            )

          )

        );

      });


    if (filtered.length === 0) {

      productsContainer.innerHTML =

        `

        <div class="empty">

          <div style="font-size:45px;">
            🛍️
          </div>

          <h3>
            No encontramos productos
          </h3>

          <p>
            Probá con otra búsqueda o categoría.
          </p>

        </div>

        `;

      return;

    }


    productsContainer.innerHTML =

      filtered.map(product => {


        const image =

          product.image_url

          ||

          product.image

          ||

          "https://via.placeholder.com/500x400?text=Sin+foto";


        const price =

          Number(product.price)

            .toLocaleString(

              "es-AR",

              {

                style:
                  "currency",

                currency:
                  "ARS"

              }

            );


        const stock =
          Number(product.stock ?? 0);


        let stockHTML =
          "";


        if (stock <= 0) {

          stockHTML =

            `

            <div class="stock agotado">

              🔴 Agotado

            </div>

            `;

        }

        else if (stock <= 3) {

          stockHTML =

            `

            <div class="stock pocas">

              🟠 Últimas ${stock} unidades

            </div>

            `;

        }

        else {

          stockHTML =

            `

            <div class="stock disponible">

              🟢 Disponible

            </div>

            `;

        }


        const message =
          `Hola! Quiero consultar por ${product.name}`;


        const whatsapp =

          `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;


        return `

          <div class="product">


            <div class="product-image">


              <button

                class="favorite-btn"

                onclick="toggleFavorite('${product.id}')"

                aria-label="Agregar a favoritos"

              >

                ${

                  favorites.includes(product.id)

                    ? "❤️"

                    : "🤍"

                }

              </button>


              <button

                class="select-btn"

                onclick="toggleCart('${product.id}')"

              >

                ${

                  cart.includes(product.id)

                    ? "✅ Agregado a mi selección"

                    : "🛒 Agregar a mi selección"

                }

              </button>


              ${

                stock <= 0

                  ?

                  `

                    <span class="badge agotado">

                      AGOTADO

                    </span>

                  `

                  :

                  ""

              }


              <img

                src="${image}"

                alt="${product.name}"

                loading="lazy"

              >


            </div>


            <div class="product-info">


              <div class="category">

                ${product.category || "Otros"}

              </div>


              <h2>

                ${product.name}

              </h2>


              <div class="price">

                ${price}

              </div>


              ${stockHTML}


              ${

                product.description

                  ?

                  `

                    <div class="description">

                      ${product.description}

                    </div>

                  `

                  :

                  ""

              }


              <a

                class="whatsapp"

                href="${whatsapp}"

                target="_blank"

                rel="noopener"

              >

                📲 Consultar por WhatsApp

              </a>


            </div>


          </div>

        `;

      }).join("");

  }


  function filterCategory(category) {

    selectedCategory =
      category;

    renderProducts();

  }


  searchInput.addEventListener(

    "input",

    renderProducts

  );


  function toggleFavorite(productId) {

    if (favorites.includes(productId)) {

      favorites =
        favorites.filter(
          id => id !== productId
        );

    }

    else {

      favorites.push(productId);

    }


    localStorage.setItem(

      "favorites",

      JSON.stringify(favorites)

    );


    renderProducts();

  }


  function showFavorites() {

    selectedCategory =
      "__FAVORITES__";

    renderProducts();

  }


  function toggleCart(productId) {

    if (cart.includes(productId)) {

      cart =
        cart.filter(
          id => id !== productId
        );

    }

    else {

      cart.push(productId);

    }


    localStorage.setItem(

      "cart",

      JSON.stringify(cart)

    );


    renderProducts();

  }


  /*
    VARIABLES DEL MAPA
  */

  let map = null;

  let marker = null;

  let selectedLocation = null;


  /*
    ABRIR MI SELECCIÓN
  */

  function showCart() {

    const selectedProducts =

      products.filter(product =>
        cart.includes(product.id)
      );


    if (selectedProducts.length === 0) {

      alert(
        "🛒 Tu selección está vacía."
      );

      return;

    }


    const productList =

      selectedProducts

        .map(product =>

          `• ${product.name} - $${Number(product.price).toLocaleString("es-AR")}`

        )

        .join("\n");


    productsContainer.innerHTML =

      `

      <div class="shipping-box">

        <h2>
          🛒 Mi selección
        </h2>


        <p style="margin-bottom:15px; line-height:1.5;">

          ${productList.replace(/\n/g, "<br>")}

        </p>


        <hr style="margin:15px 0; border:none; border-top:1px solid #ddd;">


        <h2>
          🚚 Datos de envío
        </h2>


        <label for="customerName">
          Nombre
        </label>


        <input
          id="customerName"
          type="text"
          placeholder="Tu nombre"
        >


        <label for="customerPhone">
          Teléfono
        </label>


        <input
          id="customerPhone"
          type="tel"
          placeholder="Tu teléfono"
        >


        <label for="shippingAddress">
          Dirección de entrega
        </label>


        <input
          id="shippingAddress"
          type="text"
          placeholder="Ej: Av. San Martín 1234, José C. Paz"
        >


        <button
          class="map-button"
          onclick="buscarDireccion()"
        >

          📍 Buscar dirección en el mapa

        </button>


        <div id="map"></div>


        <p class="shipping-note">

          Escribí tu dirección y tocá
          "Buscar dirección en el mapa".
          Después verificá que el marcador esté
          en el lugar correcto.

        </p>


        <button
          class="send-order"
          onclick="enviarPedido()"
        >

          📲 Enviar pedido por WhatsApp

        </button>


        <button
          onclick="volverProductos()"
          style="
            width:100%;
            margin-top:10px;
            padding:13px;
            border:none;
            border-radius:12px;
            background:#eee;
            font-weight:bold;
            cursor:pointer;
          "
        >

          ← Volver a los productos

        </button>


      </div>

      `;


    iniciarMapa();

  }


  /*
    INICIAR MAPA
  */

  function iniciarMapa() {

    setTimeout(() => {

      if (map) {

        map.remove();

        map = null;

        marker = null;

      }


      map =
        L.map("map").setView(

          [-34.5150, -58.7590],

          13

        );


      L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

          attribution:
            '&copy; OpenStreetMap contributors'

        }

      ).addTo(map);


    }, 100);

  }


  /*
    BUSCAR DIRECCIÓN
  */

  async function buscarDireccion() {

    const input =
      document.getElementById(
        "shippingAddress"
      );


    const address =
      input.value.trim();


    if (!address) {

      alert(
        "📍 Escribí una dirección primero."
      );

      return;

    }


    try {

      const response =

        await fetch(

          "https://nominatim.openstreetmap.org/search?" +

          new URLSearchParams({

            q: address + ", Buenos Aires, Argentina",

            format: "json",

            limit: "1"

          }),

          {

            headers: {

              "Accept":
                "application/json"

            }

          }

        );


      const results =
        await response.json();


      if (!results.length) {

        alert(
          "❌ No encontramos esa dirección. Probá escribirla de otra manera."
        );

        return;

      }


      const lat =
        Number(results[0].lat);


      const lon =
        Number(results[0].lon);


      selectedLocation = {

        lat:
          lat,

        lon:
          lon

      };


      map.setView(

        [lat, lon],

        16

      );


      if (marker) {

        marker.setLatLng(
          [lat, lon]
        );

      }

      else {

        marker =
          L.marker(
            [lat, lon]
          ).addTo(map);

      }


      marker.bindPopup(

        "📍 Dirección de entrega"

      ).openPopup();


    }

    catch (error) {

      console.error(error);


      alert(
        "⚠️ No se pudo buscar la dirección. Revisá tu conexión."
      );

    }

  }


  /*
    ENVIAR PEDIDO
  */

  function enviarPedido() {

    const name =
      document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
      document
        .getElementById("customerPhone")
        .value
        .trim();


    const address =
      document
        .getElementById("shippingAddress")
        .value
        .trim();


    if (!name) {

      alert(
        "Por favor ingresá tu nombre."
      );

      return;

    }


    if (!phone) {

      alert(
        "Por favor ingresá tu teléfono."
      );

      return;

    }


    if (!address) {

      alert(
        "Por favor ingresá la dirección de entrega."
      );

      return;

    }


    if (!selectedLocation) {

      alert(
        "📍 Primero buscá la dirección en el mapa."
      );

      return;

    }


    const selectedProducts =

      products.filter(product =>
        cart.includes(product.id)
      );


    if (selectedProducts.length === 0) {

      alert(
        "🛒 Tu selección está vacía."
      );

      return;

    }


    const productList =

      selectedProducts

        .map(product =>

          `• ${product.name} - $${Number(product.price).toLocaleString("es-AR")}`

        )

        .join("\n");


    const message =

      "Hola! Quiero realizar este pedido:\n\n" +

      productList +

      "\n\n" +

      "👤 Nombre: " +

      name +

      "\n" +

      "📞 Teléfono: " +

      phone +

      "\n" +

      "📍 Dirección de entrega: " +

      address +

      "\n\n" +

      "🗺️ Ubicación del mapa:\n" +

      `https://www.google.com/maps?q=${selectedLocation.lat},${selectedLocation.lon}`;


    const whatsapp =

      `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;


    window.location.href =
      whatsapp;

  }


  /*
    VOLVER A PRODUCTOS
  */

  function volverProductos() {

    selectedCategory =
      "Todos";

    renderProducts();

  }


  /*
    CARGAR PRODUCTOS
  */

  loadProducts();

</script>
