<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ofertas del Día</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f8f8f8;

  color: #171717;

  min-height: 100vh;
    }

    header {
  background: #ffffff;

  color: #0f1f4d;

  padding: 26px 15px;

  text-align: center;

  box-shadow:
    0 4px 18px rgba(15,31,77,.08);
    }
    .brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .brand-logo {
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    header h1 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 50px;
  font-weight: 900;
  letter-spacing: -0.8px;
  text-transform: uppercase;
  color: #0f1f4d;
  text-shadow: none;
    }

    header p {
      margin-top: 8px;
      color: #3b82f6;
font-size: 17px;
font-weight: 700;
letter-spacing: .2px;
    }

    /* =========================
       BARRA DE NAVEGACIÓN
       (logo + buscador + iconos)
    ========================= */

    .topbar-wrap {
      position: sticky;
      top: 0;
      z-index: 99;
      padding: 10px 15px;
      background: #f8f8f8;
    }

    .topbar {
      max-width: 1150px;
      margin: 0 auto;
      background: linear-gradient(135deg, #0f1f4d, #16265f);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(15,31,77,.28);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .topbar-logo {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
    }

    .topbar-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .topbar-brand-text strong {
      color: white;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -.3px;
    }

    .topbar-brand-text span {
      color: #4da3ff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -.3px;
    }

    .topbar-search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .topbar-search-icon {
      position: absolute;
      left: 16px;
      color: #0f1f4d;
      font-size: 16px;
      pointer-events: none;
    }

    .topbar-icons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .icon-btn {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,.22);
    }

    .icon-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ff4b3e;
      color: white;
      font-size: 10px;
      font-weight: 800;
      min-width: 17px;
      height: 17px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid #0f1f4d;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 15px 15px 45px;
    }


    /* =========================
       CARRUSEL
    ========================= */

    .hero-slider {
      position: relative;
      width: 100%;
      height: 330px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 22px;
      background: linear-gradient(135deg, #ff4b3e, #ff766b);
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .7s ease;
      pointer-events: none;
    }

    .hero-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .hero-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 25px;
      background: linear-gradient(
        transparent 25%,
        rgba(0,0,0,.78)
      );
      color: white;
    }

    .hero-content {
      width: 100%;
      max-width: 650px;
    }

    .hero-content .tag {
      display: inline-block;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(5px);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .hero-content h2 {
      font-size: 29px;
      margin-bottom: 5px;
      text-shadow: 0 2px 5px rgba(0,0,0,.25);
    }

    .hero-content .hero-price {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .hero-content button {
      border: none;
      background: white;
      color: #171717;
      padding: 11px 17px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .slider-dots {
      position: absolute;
      bottom: 13px;
      right: 18px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .slider-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.5);
    }

    .slider-dot.active {
      background: white;
      transform: scale(1.25);
    }


    /* =========================
       BUSCADOR
    ========================= */

    #search {
  width: 100%;
  padding: 13px 22px 13px 42px;

  border: none;
  border-radius: 12px;

  font-size: 15px;
  font-weight: 500;

  outline: none;

  background: #ffffff;
  color: #222;

  box-shadow:
    0 3px 12px rgba(0,0,0,.06);

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}


#search::placeholder {
  color: #888;
}


#search:focus {
  box-shadow:
    0 0 0 3px rgba(255,255,255,.25);
}


    /* =========================
       CATEGORÍAS
    ========================= */

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 3px 2px 12px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .categories button {
      border: 1px solid #e7e7e7;
      background: white;
      color: #333;
      padding: 11px 17px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 9px rgba(0,0,0,.05);
      transition: .2s ease;
    }

    .categories button:hover {
      background: #ff4b3e;
      border-color: #ff4b3e;
      color: white;
      transform: translateY(-1px);
    }

    .special-buttons {
      margin-top: 5px;
      padding-top: 10px;
      border-top: 1px solid #e7e7e7;
    }

    .special-buttons button {
      background: #171717;
      color: white;
      border-color: #171717;
    }

    .special-buttons button:hover {
      background: #ff4b3e;
      border-color: #ff4b3e;
    }


    /* =========================
       TÍTULO
    ========================= */

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 25px 0 15px;
    }

    .section-title h2 {
      font-size: 24px;
      font-weight: 900;
    }

    .section-title span {
      color: #777;
      font-size: 13px;
    }


    /* =========================
       PRODUCTOS
    ========================= */

    .products {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(245px, 1fr)
      );
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
      border: 1px solid #eeeeee;
      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,.11);
    }


    /* =========================
       GALERÍA DE PRODUCTO
    ========================= */

    .product-image {
      position: relative;
      width: 100%;
      height: 260px;
      background: #eeeeee;
      overflow: hidden;
    }

    .product-gallery {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .product-gallery::-webkit-scrollbar {
      display: none;
    }

    .product-gallery img {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      scroll-snap-align: start;
    }


    /* =========================
       INDICADOR DE FOTOS
    ========================= */

    .gallery-dots {
      position: absolute;
      left: 50%;
      bottom: 52px;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 4;
      pointer-events: none;
    }

    .gallery-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.65);
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
    }


    /* =========================
       FAVORITO
    ========================= */

    .favorite-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.95);
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,.16);
    }


    /* =========================
       SELECCIÓN
    ========================= */

    .select-btn {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 5;
      border: none;
      border-radius: 12px;
      padding: 11px;
      background: rgba(255,255,255,.96);
      color: #171717;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }

    .select-btn:hover {
      background: #ff4b3e;
      color: white;
    }


    /* =========================
       AGOTADO
    ========================= */

    .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 4;
      background: #555;
      color: white;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }


    /* =========================
       INFO PRODUCTO
    ========================= */

    .product-info {
      padding: 18px;
    }

    .category {
      color: #888;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .product h2 {
      font-size: 19px;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .price {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 11px;
      color: #171717;
    }

    .stock {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .disponible {
      background: #e7f8eb;
      color: #17852b;
    }

    .pocas {
      background: #fff2d8;
      color: #b76a00;
    }

    .agotado {
      background: #eeeeee;
      color: #555;
    }

    .description {
      color: #666;
      line-height: 1.5;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #20c76a;
      color: white;
      padding: 13px;
      border-radius: 12px;
      font-weight: bold;
    }

    .whatsapp:hover {
      opacity: .9;
    }


    /* =========================
       VACÍO
    ========================= */

    .empty {
      background: white;
      padding: 45px 20px;
      border-radius: 20px;
      text-align: center;
      grid-column: 1 / -1;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .loading {
      font-size: 18px;
    }


    /* =========================
       MI SELECCIÓN / ENVÍO
    ========================= */

    .shipping-box {
      background: white;
      padding: 22px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
      border: 1px solid #eeeeee;
      grid-column: 1 / -1;
    }

    .shipping-box h2 {
      margin-bottom: 15px;
    }

    .selected-list {
      background: #f7f7f8;
      border-radius: 14px;
      padding: 15px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .shipping-box label {
      display: block;
      font-weight: bold;
      margin: 12px 0 7px;
    }

    .shipping-box input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e2e2;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .shipping-box input:focus {
      border-color: #ff4b3e;
    }

    .map-button {
      width: 100%;
      border: none;
      background: #171717;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }

    .map-button:hover {
      background: #ff4b3e;
    }

    #map {
      width: 100%;
      height: 310px;
      border-radius: 15px;
      margin-top: 12px;
      overflow: hidden;
    }

    .shipping-note {
      color: #777;
      font-size: 13px;
      line-height: 1.45;
      margin-top: 9px;
    }

    .send-order {
      width: 100%;
      border: none;
      background: #20c76a;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
    }

    .send-order:hover {
      opacity: .9;
    }

    .back-button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #eeeeee;
      color: #333;
      font-weight: bold;
      cursor: pointer;
    }


    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp-floating {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #20c76a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      text-decoration: none;
      box-shadow: 0 5px 18px rgba(0,0,0,.25);
      z-index: 200;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #171717;
      color: white;
      text-align: center;
      padding: 25px 15px;
      margin-top: 25px;
    }

    footer p + p {
      margin-top: 5px;
      color: #aaa;
      font-size: 13px;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      header h1 {
        font-size: 38px;
      }

      .brand-logo {
        width: 70px;
        height: 70px;
      }

      .topbar {
        border-radius: 14px;
        padding: 8px 10px;
        gap: 8px;
      }

      .topbar-brand-text {
        display: none;
      }

      .container {
        padding: 12px 12px 35px;
      }

      .hero-slider {
        height: 300px;
        border-radius: 18px;
      }

      .hero-overlay {
        padding: 18px;
      }

      .hero-content h2 {
        font-size: 23px;
      }

      .hero-content .hero-price {
        font-size: 21px;
      }

      .products {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .product-image {
        height: 280px;
      }

      .section-title h2 {
        font-size: 21px;
      }

    }

  </style>

</head>

  /* =========================
     CONFIGURACIÓN

  const SUPABASE_URL =

  const SUPABASE_KEY =

  /* =========================

  function updateCartCount() {

    const cartCountEl =
      document.getElementById("cartCount");

    if (cartCountEl) {

      cartCountEl.textContent =
        cart.length;

    }

  }


  /* =========================
     CARRUSEL

  let sliderProducts = [];

  let sliderIndex = 0;

  function getProductImages(product) {

    if (
      Array.isArray(product.images) &&
      product.images.length > 0
    ) {

      return product.images
        .map(img => {

          if (typeof img === "string") {
            return img;
          }

          if (
            img &&
            typeof img === "object" &&
            img.image_url
          ) {
            return img.image_url;
          }

          return null;

        })
        .filter(Boolean);

    }


    if (product.image_url) {
      return [product.image_url];
    }


    if (product.image) {
      return [product.image];
    }


    return [
      "https://via.placeholder.com/500x400?text=Sin+foto"
    ];

  }


  function getRandomProducts() {

    if (!products.length) {
      return [];
    }

    const shuffled =
      [...products].sort(
        () => Math.random() - 0.5
      );

    return shuffled.slice(
      0,
      Math.min(6, shuffled.length)
    );

  }


  function startSlider() {

    if (!products.length) {
      return;
    }

    sliderProducts =
      getRandomProducts();

    sliderIndex = 0;

    renderHeroSlide();


    if (sliderTimer) {

      clearInterval(sliderTimer);

    }


    sliderTimer =
      setInterval(() => {

        sliderIndex++;


        if (
          sliderIndex >=
          sliderProducts.length
        ) {

          sliderProducts =
            getRandomProducts();

          sliderIndex = 0;

        }


        renderHeroSlide();

      }, 4000);

  }


  function renderHeroSlide() {

    const slider =
      document.getElementById(
        "heroSlider"
      );

    const dots =
      document.getElementById(
        "sliderDots"
      );


    if (
      !slider ||
      !sliderProducts.length
    ) {

      return;

    }


    const product =
      sliderProducts[sliderIndex];


    const images =
      getProductImages(product);


    const image =
      images[0];


    const price =
      Number(product.price)
        .toLocaleString(
          "es-AR",
          {
            style: "currency",
            currency: "ARS"
          }
        );


    const oldSlides =
      slider.querySelectorAll(
        ".hero-slide"
      );


    oldSlides.forEach(
      slide => slide.remove()
    );


    const slide =
      document.createElement("div");


    slide.className =
      "hero-slide active";


    slide.innerHTML = `

      <img
        src="${image}"
        alt="${product.name}"
        onerror="this.src='https://via.placeholder.com/900x500?text=Sin+foto'"
      >

      <div class="hero-overlay">

        <div class="hero-content">

          <span class="tag">
            ⭐ PRODUCTO DESTACADO
          </span>

          <h2>
            ${product.name}
          </h2>

          <div class="hero-price">
            ${price}
          </div>

          <button
            onclick="goToProduct('${product.id}')"
          >
            Ver producto →
          </button>

        </div>

      </div>

    `;


    slider.insertBefore(
      slide,
      dots
    );


    dots.innerHTML =
      sliderProducts
        .map(
          (_, index) => `
            <span
              class="slider-dot ${
                index === sliderIndex
                  ? "active"
                  : ""
              }"
            ></span>
          `
        )
        .join("");

  }


  function goToProduct(productId) {

    const element =
      document.querySelector(
        `[data-product-id="${productId}"]`
      );


    if (element) {

      element.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

      return;

    }


    selectedCategory = "Todos";

    searchInput.value = "";

    renderProducts();


    setTimeout(() => {

      const productElement =
        document.querySelector(
          `[data-product-id="${productId}"]`
        );


      if (productElement) {

        productElement.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }

    }, 100);

  }


  /* =========================
     CARGAR PRODUCTOS
  ========================= */

  async function loadProducts() {

    productsContainer.innerHTML = `

      <div class="empty loading">

        🔄 Cargando productos...

      </div>

    `;


    try {

      const controller =
        new AbortController();


      const timeoutId =
        setTimeout(
          () => controller.abort(),
          10000
        );


      const response =
        await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/get_public_products`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`
            },

            body:
              JSON.stringify({
                p_user_id:
                  USER_ID
              }),

            signal:
              controller.signal
          }
        );


      clearTimeout(timeoutId);


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          `Supabase respondió ${response.status}: ${errorText}`
        );

      }


      products =
        await response.json();


      console.log(
        "PRODUCTOS RECIBIDOS:",
        products
      );


      console.log(
        "FOTOS DEL PRIMER PRODUCTO:",
        products[0]?.images
      );


      /* =========================
         LIMPIAR SELECCIÓN/FAVORITOS
         DE PRODUCTOS QUE YA NO EXISTEN
      ========================= */

      const validIds =
        new Set(
          products.map(
            product => product.id
          )
        );

      cart =
        cart.filter(
          id => validIds.has(id)
        );

      favorites =
        favorites.filter(
          id => validIds.has(id)
        );

      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

      localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
      );

      updateCartCount();


      renderProducts();

      startSlider();


    }

    catch (error) {

      console.error(error);


      productsContainer.innerHTML = `

        <div class="empty">

          <h3>
            ⚠️ No se pudieron cargar los productos
          </h3>

          <p>
            ${error.message}
          </p>

        </div>

      `;

    }

  }


  /* =========================
     RENDER PRODUCTOS
  ========================= */

  function renderProducts() {

    const search =
      searchInput.value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(product => {

        const name =
          (product.name || "")
            .toLowerCase();


        const category =
          product.category || "";


        return (

          name.includes(search)

          &&

          (

            selectedCategory === "Todos"

            ||

            (

              selectedCategory ===
              "Liquidación"

              ?

              product.is_liquidation === true

              :

              selectedCategory ===
              "__FAVORITES__"

              ?

              favorites.includes(
                product.id
              )

              :

              category.toLowerCase() ===
              selectedCategory.toLowerCase()

            )

          )

        );

      });


    if (!filtered.length) {

      productsContainer.innerHTML = `

        <div class="empty">

          <div style="font-size:45px;">
            🛍️
          </div>

          <h3>
            No encontramos productos
          </h3>

          <p>
            Probá con otra búsqueda o categoría.
          </p>

        </div>

      `;

      return;

    }


    productsContainer.innerHTML =

      filtered.map(product => {


        /* =========================
           AQUÍ SE OBTIENEN TODAS
           LAS FOTOS DEL PRODUCTO
        ========================= */

        const images =
          getProductImages(product);


        const price =
          Number(product.price)
            .toLocaleString(
              "es-AR",
              {
                style: "currency",
                currency: "ARS"
              }
            );


        const stock =
          Number(
            product.stock ?? 0
          );


        let stockHTML = "";


        if (stock <= 0) {

          stockHTML = `

            <div class="stock agotado">
              🔴 Agotado
            </div>

          `;

        }

        else if (stock <= 3) {

          stockHTML = `

            <div class="stock pocas">
              🟠 Últimas ${stock} unidades
            </div>

          `;

        }

        else {

          stockHTML = `

            <div class="stock disponible">
              🟢 Disponible
            </div>

          `;

        }


        const message =
          `Hola! Quiero consultar por ${product.name}`;


        const whatsapp =
          `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;


        /* =========================
           GENERAR TODAS LAS FOTOS
        ========================= */

        const galleryHTML =
          images.map(
            (img, index) => `

              <img
                src="${img}"
                alt="${product.name} - foto ${index + 1}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/500x400?text=Sin+foto'"
              >

            `
          ).join("");


        /* =========================
           PUNTITOS DE GALERÍA
        ========================= */

        const dotsHTML =
          images.length > 1
            ? `

              <div class="gallery-dots">

                ${images.map(
                  (_, index) => `
                    <span
                      class="gallery-dot"
                    ></span>
                  `
                ).join("")}

              </div>

            `
            : "";


        return `

          <div
            class="product"
            data-product-id="${product.id}"
          >

            <div class="product-image">


              <!-- FAVORITO -->

              <button
                class="favorite-btn"
                onclick="toggleFavorite('${product.id}')"
                aria-label="Agregar a favoritos"
              >

                ${
                  favorites.includes(product.id)
                    ? "❤️"
                    : "🤍"
                }

              </button>


              <!-- SELECCIÓN -->

              <button
                class="select-btn"
                onclick="toggleCart('${product.id}')"
              >

                ${
                  cart.includes(product.id)
                    ? "✅ Agregado a mi selección"
                    : "🛒 Agregar a mi selección"
                }

              </button>


              <!-- AGOTADO -->

              ${
                stock <= 0
                  ? `
                    <span class="badge agotado">
                      AGOTADO
                    </span>
                  `
                  : ""
              }


              <!-- GALERÍA -->

              <div
                class="product-gallery"
              >

                ${galleryHTML}

              </div>


              <!-- PUNTITOS -->

              ${dotsHTML}


            </div>


            <div class="product-info">


              <div class="category">

                ${
                  product.category ||
                  "Otros"
                }

              </div>


              <h2>
                ${product.name}
              </h2>


              <div class="price">
                ${price}
              </div>


              ${stockHTML}


              ${
                product.description
                  ? `

                    <div class="description">
                      ${product.description}
                    </div>

                  `
                  : ""
              }


              <a
                class="whatsapp"
                href="${whatsapp}"
                target="_blank"
                rel="noopener"
              >

                📲 Consultar por WhatsApp

              </a>


            </div>


          </div>

        `;

      }).join("");

  }


  /* =========================
     FILTROS
  ========================= */

  function filterCategory(category) {

    selectedCategory =
      category;

    renderProducts();

  }


  searchInput.addEventListener(
    "input",
    renderProducts
  );


  /* =========================
     FAVORITOS
  ========================= */

  function toggleFavorite(productId) {

    if (
      favorites.includes(productId)
    ) {

      favorites =
        favorites.filter(
          id => id !== productId
        );

    }

    else {

      favorites.push(productId);

    }


    localStorage.setItem(
      "favorites",
      JSON.stringify(favorites)
    );


    renderProducts();

  }


  function showFavorites() {

    selectedCategory =
      "__FAVORITES__";

    renderProducts();

  }


  /* =========================
     MI SELECCIÓN
  ========================= */

  function toggleCart(productId) {

    if (
      cart.includes(productId)
    ) {

      cart =
        cart.filter(
          id => id !== productId
        );

    }

    else {

      cart.push(productId);

    }


    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );


    updateCartCount();

    renderProducts();

  }


  /* =========================
     MAPA
  ========================= */

  let map = null;

  let marker = null;

  let selectedLocation = null;


  function showCart() {

    const selectedProducts =
      products.filter(
        product =>
          cart.includes(product.id)
      );


    if (!selectedProducts.length) {

      alert(
        "🛒 Tu selección está vacía."
      );

      return;

    }


    const productList =
      selectedProducts
        .map(
          product =>
            `• ${product.name} - ${Number(product.price).toLocaleString("es-AR")}`
        )
        .join("\n");


    productsContainer.innerHTML = `

      <div class="shipping-box">

        <h2>
          🛒 Mi selección
        </h2>


        <div class="selected-list">

          ${productList.replace(
            /\n/g,
            "<br>"
          )}

        </div>


        <h2>
          🚚 Datos de envío
        </h2>


        <label for="customerName">
          Nombre
        </label>

        <input
          id="customerName"
          type="text"
          placeholder="Tu nombre"
        >


        <label for="customerPhone">
          Teléfono
        </label>

        <input
          id="customerPhone"
          type="tel"
          placeholder="Tu teléfono"
        >


        <label for="shippingAddress">
          Dirección de entrega
        </label>

        <input
          id="shippingAddress"
          type="text"
          placeholder="Ej: Av. San Martín 1234"
        >


        <button
          class="map-button"
          onclick="buscarDireccion()"
        >

          📍 Buscar dirección en el mapa

        </button>


        <div id="map"></div>


        <p class="shipping-note">

          Escribí tu dirección y tocá
          "Buscar dirección en el mapa".
          Verificá que el marcador esté
          ubicado correctamente.

        </p>


        <button
          class="send-order"
          onclick="enviarPedido()"
        >

          📲 Enviar pedido por WhatsApp

        </button>


        <button
          class="back-button"
          onclick="volverProductos()"
        >

          ← Volver a los productos

        </button>


      </div>

    `;


    iniciarMapa();

  }


  function iniciarMapa() {

    setTimeout(() => {

      if (map) {

        map.remove();

        map = null;

        marker = null;

      }


      map =
        L.map("map").setView(
          [
            -34.5150,
            -58.7590
          ],
          13
        );


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution:
            "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);

    }, 100);

  }


  async function buscarDireccion() {

    const input =
      document.getElementById(
        "shippingAddress"
      );


    const address =
      input.value.trim();


    if (!address) {

      alert(
        "📍 Escribí una dirección primero."
      );

      return;

    }


    try {

      const response =
        await fetch(
          "https://nominatim.openstreetmap.org/search?" +
          new URLSearchParams({
            q:
              address +
              ", Buenos Aires, Argentina",
            format: "json",
            limit: "1"
          }),
          {
            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      const results =
        await response.json();


      if (!results.length) {

        alert(
          "❌ No encontramos esa dirección. Probá escribirla de otra manera."
        );

        return;

      }


      const lat =
        Number(results[0].lat);

      const lon =
        Number(results[0].lon);


      selectedLocation = {
        lat: lat,
        lon: lon
      };


      map.setView(
        [lat, lon],
        16
      );


      if (marker) {

        marker.setLatLng(
          [lat, lon]
        );

      }

      else {

        marker =
          L.marker(
            [lat, lon]
          ).addTo(map);

      }


      marker
        .bindPopup(
          "📍 Dirección de entrega"
        )
        .openPopup();

    }

    catch (error) {

      console.error(error);

      alert(
        "⚠️ No se pudo buscar la dirección. Revisá tu conexión."
      );

    }

  }


  /* =========================
     ENVIAR PEDIDO
  ========================= */

  function enviarPedido() {

    const name =
      document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
      document
        .getElementById("customerPhone")
        .value
        .trim();


    const address =
      document
        .getElementById("shippingAddress")
        .value
        .trim();


    if (!name) {

      alert(
        "Por favor ingresá tu nombre."
      );

      return;

    }


    if (!phone) {

      alert(
        "Por favor ingresá tu teléfono."
      );

      return;

    }


    if (!address) {

      alert(
        "Por favor ingresá la dirección de entrega."
      );

      return;

    }


    if (!selectedLocation) {

      alert(
        "📍 Primero buscá la dirección en el mapa."
      );

      return;

    }


    const selectedProducts =
      products.filter(
        product =>
          cart.includes(product.id)
      );


    if (!selectedProducts.length) {

      alert(
        "🛒 Tu selección está vacía."
      );

      return;

    }


    const productList =
      selectedProducts
        .map(
          product =>
            `• ${product.name} - $${Number(product.price).toLocaleString("es-AR")}`
        )
        .join("\n");


    const message =
      "Hola! Quiero realizar este pedido:\n\n" +
      productList +
      "\n\n" +
      "👤 Nombre: " +
      name +
      "\n" +
      "📞 Teléfono: " +
      phone +
      "\n" +
      "📍 Dirección de entrega: " +
      address +
      "\n\n" +
      "🗺️ Ubicación:\n" +
      `https://www.google.com/maps?q=${selectedLocation.lat},${selectedLocation.lon}`;


    const whatsapp =
      `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;


    window.location.href =
      whatsapp;

  }


  /* =========================
     VOLVER
  ========================= */

  function volverProductos() {

    selectedCategory =
      "Todos";

    searchInput.value =
      "";

    renderProducts();

  }


  /* =========================
     INICIO
  ========================= */

  updateCartCount();

  loadProducts();


</script>


</body>

</html>
