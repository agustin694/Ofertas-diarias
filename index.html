<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ofertas Diarias</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #ddd;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 25px;
    }

    .categories button {
      border: none;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product h2 {
      font-size: 19px;
      margin: 0 0 8px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .description {
      color: #666;
      font-size: 14px;
      min-height: 40px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ OFERTAS DIARIAS</h1>
  <p>Electrodomésticos • Ropa • Hogar • Tecnología y mucho más</p>
</header>

<div class="container">

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔎 Buscar productos..."
  >

  <div class="categories">
    <button onclick="filterCategory('Todos')">Todos</button>
    <button onclick="filterCategory('Electrodomésticos')">Electrodomésticos</button>
    <button onclick="filterCategory('Ropa')">Ropa</button>
    <button onclick="filterCategory('Tecnología')">Tecnología</button>
    <button onclick="filterCategory('Hogar')">Hogar</button>
  </div>

  <div id="products" class="products"></div>

</div>

<script>
  const productsContainer = document.getElementById("products");
  const searchInput = document.getElementById("search");

  let products = [];
  let selectedCategory = "Todos";

  function renderProducts() {

    const search = searchInput.value.toLowerCase();

    const filtered = products.filter(product => {

      const matchesSearch =
        product.name.toLowerCase().includes(search);

      const matchesCategory =
        selectedCategory === "Todos" ||
        product.category === selectedCategory;

      return matchesSearch && matchesCategory;
    });

    if (filtered.length === 0) {
      productsContainer.innerHTML =
        '<div class="empty">No hay productos disponibles.</div>';
      return;
    }

    productsContainer.innerHTML = filtered.map(product => {

      const image = product.image_url ||
        "https://via.placeholder.com/500x400?text=Sin+foto";

      const price = Number(product.price).toLocaleString(
        "es-AR",
        {
          style: "currency",
          currency: "ARS"
        }
      );

      return `
        <div class="product">

          <img src="${image}" alt="${product.name}">

          <div class="product-info">

            <h2>${product.name}</h2>

            <div class="price">${price}</div>

            <div class="description">
              ${product.description || ""}
            </div>

            <a
              class="whatsapp"
              href="https://wa.me/?text=Hola!%20Quiero%20consultar%20por%20${encodeURIComponent(product.name)}"
              target="_blank">
              📲 Consultar por WhatsApp
            </a>

          </div>

        </div>
      `;

    }).join("");
  }

  function filterCategory(category) {
    selectedCategory = category;
    renderProducts();
  }

  searchInput.addEventListener("input", renderProducts);

  /*
    Por ahora mostramos un mensaje.
    En el próximo paso conectaremos esta página
    con tu proyecto de Supabase.
  */

  productsContainer.innerHTML =
    '<div class="empty">Cargando productos...</div>';
</script>

</body>
</html>
